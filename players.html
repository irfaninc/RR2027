<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Roadha Run 2027 — Players</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {theme: {extend: {fontFamily: {sans: ['Inter', 'sans-serif']}}}};
  </script>
  <style>
    :root {
      color-scheme: light
    }

    body {
      background: #fafaf9
    }
  </style>
</head>

<body class="font-sans text-stone-900 antialiased">
  <div class="min-h-screen">
    <header class="border-b border-stone-200 bg-white/80 backdrop-blur">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <span class="grid place-items-center w-8 h-8 rounded-lg bg-orange-600 text-white" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.75" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 3v1.5M3 21v-6m0 0 2.77-.693a9 9 0 0 1 6.208.682l.108.054a9 9 0 0 0 6.086.71l3.114-.732a48.524 48.524 0 0 1-.005-10.499l-3.11.732a9 9 0 0 1-6.085-.711l-.108-.054a9 9 0 0 0-6.208-.682L3 4.5M3 15V4.5" />
            </svg>
          </span>
          <div class="leading-tight">
            <p class="font-semibold tracking-tight">Roadha Run 2027</p>
            <p class="text-xs text-stone-500">Players</p>
          </div>
        </div>
        <nav class="flex items-center gap-2" aria-label="Pages">
          <a href="rules.html"
            class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-stone-600 transition hover:bg-stone-100 hover:text-stone-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500 focus-visible:ring-offset-2">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.75" class="w-4 h-4" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
            </svg>
            <span class="sr-only sm:not-sr-only">Rules</span>
          </a>
          <a href="index.html"
            class="inline-flex items-center gap-2 rounded-lg border border-stone-200 bg-white px-3.5 py-2 text-sm font-medium text-stone-700 shadow-sm transition hover:bg-stone-50 hover:border-stone-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500 focus-visible:ring-offset-2">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.75" class="w-4 h-4" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M6 6.878V6a2.25 2.25 0 0 1 2.25-2.25h7.5A2.25 2.25 0 0 1 18 6v.878m-12 0c.235-.083.487-.128.75-.128h10.5c.263 0 .515.045.75.128m-12 0A2.25 2.25 0 0 0 4.5 9v.878m13.5-3A2.25 2.25 0 0 1 19.5 9v.878m0 0a2.246 2.246 0 0 0-.75-.128H5.25c-.263 0-.515.045-.75.128m15 0A2.25 2.25 0 0 1 21 12v6a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18v-6c0-.98.626-1.813 1.5-2.122" />
            </svg>
            <span class="sr-only sm:not-sr-only">Team draw</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <p class="text-xs font-semibold uppercase tracking-[0.14em] text-stone-400">Roadha Run 2027</p>
      <h1 class="mt-2 text-3xl sm:text-5xl font-semibold tracking-tight">Players</h1>
      <p id="summary" class="mt-3 text-stone-500"></p>

      <div id="groups" class="mt-10 grid gap-12"></div>
    </main>
  </div>

  <script>
    'use strict';
    // Mirrors the seeds and pots in index.html; keep the two in sync.
    const groups = [
      {title: 'Seeded players', note: 'Team captains', seed: true, players: ['Beybe', 'Kokki', 'Khadhy', 'Abbu']},
      {title: 'Pot 1', note: '2 per team', players: ['Rambo', 'Dhombe', 'Akko', 'Raamy', 'KD', 'Amna', 'Rauf', 'Irfan']},
      {title: 'Pot 2', note: '1 per team', players: ['Zauu', 'Rathu', 'Mayya', 'Firsan']},
      {title: 'Pot 3', note: '2 per team', players: ['Mamma', 'Kudaatha', 'Bappa', 'Shaff', 'Saru', 'Shatha', 'Siru', 'Leewaan']},
    ];
    // Photos live in images/runners/<Name>.jpg; list any other extensions here.
    const photoExt = {Abbu: 'png'};
    const $ = id => document.getElementById(id);

    function initialsAvatar(name, seed) {
      const el = document.createElement('span');
      el.className = 'grid place-items-center w-24 h-24 rounded-full text-3xl font-semibold ring-4 ring-white shadow-sm ' +
        (seed ? 'bg-orange-100 text-orange-800' : 'bg-stone-100 text-stone-500');
      el.textContent = name.length <= 2 ? name : name[0];
      el.setAttribute('aria-hidden', 'true');
      return el;
    }

    function playerCard(name, group) {
      const card = document.createElement('li');
      card.className = 'flex flex-col items-center px-2 py-3 text-center';
      const img = document.createElement('img');
      img.src = `images/runners/${name}.${photoExt[name] || 'jpg'}`;
      img.alt = name;
      img.loading = 'lazy';
      img.className = 'w-24 h-24 rounded-full object-cover ring-4 shadow-sm ' + (group.seed ? 'ring-orange-100' : 'ring-stone-100');
      // No photo yet: fall back to an initial so the card still looks complete.
      img.onerror = () => img.replaceWith(initialsAvatar(name, group.seed));
      const label = document.createElement('p');
      label.className = 'mt-4 font-semibold tracking-tight';
      label.textContent = name;
      const sub = document.createElement('p');
      sub.className = 'mt-0.5 text-xs ' + (group.seed ? 'font-medium text-orange-700' : 'text-stone-400');
      sub.textContent = group.seed ? 'Seed' : group.title;
      card.append(img, label, sub);
      return card;
    }

    groups.forEach(group => {
      const section = document.createElement('section');
      section.innerHTML = `<div class="flex items-baseline justify-between gap-4 border-b border-stone-200 pb-3">
          <h2 class="text-lg font-semibold tracking-tight">${group.title}</h2>
          <p class="text-sm text-stone-400"><span class="tabular-nums">${group.players.length}</span> players · ${group.note}</p>
        </div>`;
      const list = document.createElement('ul');
      list.className = 'mt-5 grid grid-cols-2 gap-3 sm:grid-cols-4 sm:gap-4';
      group.players.forEach(name => list.append(playerCard(name, group)));
      section.append(list);
      $('groups').append(section);
    });
    $('summary').textContent = `${groups.reduce((n, g) => n + g.players.length, 0)} runners across 4 teams: 4 seeded captains and 3 pots.`;
  </script>
</body>

</html>
